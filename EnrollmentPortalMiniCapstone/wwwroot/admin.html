<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }
    </style>

</head>

<body>

    <h1>Enrolled Students</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Contact</th>
                <th>Course</th>
                <th>Year</th>
                <th>Address</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

    <script>
        fetch('/students')
            .then(res => res.json())
            .then(data => {
                let table = document.getElementById("tableBody");

                data.forEach(student => {
                    let row = `<tr>
                    <td>${student.Name}</td>
                    <td>${student.Email}</td>
                    <td>${student.Contact}</td>
                    <td>${student.Course}</td>
                    <td>${student.Year}</td>
                    <td>${student.Address}</td>
                </tr>`;

                    table.innerHTML += row;
                });
            });
    </script>
    <div class="extra-link">
        <a href="admin-login.html">Back to Student Login</a> <!-- NEW --><!-- BACK TO ADMIN LOGIN -->
    </div>

</body>
</html>
