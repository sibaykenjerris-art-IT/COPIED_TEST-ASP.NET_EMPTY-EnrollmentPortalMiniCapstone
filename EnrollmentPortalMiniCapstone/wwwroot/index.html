<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enrollment Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="page-container">
        <h1>Portal Online Enrollment System</h1>
        <div class="container">
            <h2>Student Enrollment Form</h2>
            <form method="post" action="/enroll">
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" name="Name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="Email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" name="Contact" placeholder="09xxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="Course" required>
                        <option value="">Select Course</option>
                        <option value="cs">Computer Science</option>
                        <option value="ba">Business Administration</option>
                        <option value="it">Bachelor of Science in Information Technology</option>
                        <option value="edu">Bachelor of Education</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="year">Year Level</label>
                    <select id="year" name="Year" required>
                        <option value="">Select Year Level</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="Address" placeholder="Enter address" rows="3" required></textarea>
                </div>
                <button type="submit">Enroll Now</button>
            </form>
            <p class="footer-text">&copy; 2026 Online Enrollment System</p>
        </div>
    </div>
    <div class="extra-link">
        <a href="login.html">Back to Student Login</a> <!-- NEW --> <!-- BACK TO STUDENT LOGIN -->
    </div>

</body>
</html>
