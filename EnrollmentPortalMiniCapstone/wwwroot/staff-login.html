<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <title>Staff Login</title>

    <link rel="stylesheet" href="css/staff-login.css"> 

</head>

<body>

    <div class="login-container">

        <h2>Staff Login</h2>

        <!-- ERROR MESSAGE -->
        <p id="errorMsg"></p>

        <form method="post" action="/staff-login">

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>

        </form>

        <div class="extra-link">
            <a href="welcome.html">Back to Enrollment</a>
        </div>

    </div>

    <!-- SHOW ERROR IF WRONG LOGIN -->
    <script>
        // step 1: Get URL parameters
        const params = new URLSearchParams(window.location.search);

        // step 2: Check if error exists
        if (params.get("error"))
        {
            // step 3: Show message
            document.getElementById("errorMsg").textContent = "Invalid login!";
            document.getElementById("errorMsg").style.color = "red";
        }
    </script>

</body>
</html>
