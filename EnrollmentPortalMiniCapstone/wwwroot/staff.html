<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="css/dashboard-staff.css">
</head>

<body>

    <h1>Staff Dashboard</h1>

    <!-- LOGOUT -->
    <button class="logout" onclick="window.location.href='/staff-login.html'">Logout</button>

    <div class="container">

        <!-- STATS -->
        <div id="stats">
            <div class="stat-box approved">Approved<br><span id="approvedCount">0</span></div>
            <div class="stat-box rejected">Rejected<br><span id="rejectedCount">0</span></div>
            <div class="stat-box pending">Pending<br><span id="pendingCount">0</span></div>
        </div>

        <!-- FILTER -->
        <div class="filters">
            <button onclick="filterYear('All')">All</button>
            <button onclick="filterYear('1st Year')">1st Year</button>
            <button onclick="filterYear('2nd Year')">2nd Year</button>
            <button onclick="filterYear('3rd Year')">3rd Year</button>
            <button onclick="filterYear('4th Year')">4th Year</button>
        </div>

        <!-- CURRENT VIEW -->
        <div id="currentView">Viewing: All</div>

        <!-- TABLE -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Course</th>
                    <th>Year</th>
                    <th>Status</th>
                    <th>Remarks</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>

    </div>

    <!-- CONFIRM MODAL -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p id="modalText">Are you sure?</p>
            <button onclick="confirmAction()">Yes</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>

        // ==============================
        // GLOBAL VARIABLES
        // ==============================
        let students = [];
        let currentFilter = "All";

        // FOR MODAL
        let selectedId = null;
        let selectedStatus = "";
        let selectedRemarks = "";
        let selectedAction = "";


        // ==============================
        // LOAD STUDENTS FROM SERVER
        // ==============================
        function loadStudents() {

            fetch('/students')
                .then(res => res.json())
                .then(data => {

                    students = data;

                    renderTable();
                });
        }


        // ==============================
        // RENDER TABLE + COUNTERS
        // ==============================
        function renderTable() {

            let table = document.getElementById("tableBody");
            table.innerHTML = "";

            let approved = 0;
            let rejected = 0;
            let pending = 0;

            students.forEach(s => {

                // FILTER FIX
                if (currentFilter !== "All" && s.year !== currentFilter) return;

                // COUNT
                if (s.status === "Approved") approved++;
                else if (s.status === "Rejected") rejected++;
                else pending++;

                // COLOR STATUS
                let color = "orange";
                if (s.status === "Approved") color = "green";
                if (s.status === "Rejected") color = "red";

                let row = `
            <tr>
                <td>${s.name}</td>
                <td>${s.email}</td>
                <td>${s.contact}</td>
                <td>${s.course}</td>
                <td>${s.year}</td>

                <td style="color:${color}; font-weight:bold;">
                    ${s.status}
                </td>

                <td>${s.remarks}</td>

                <td>
                    <div class="actions">

                        <button class="approve"
                        onclick="openModal(${s.id}, 'Approved', 'Verified', 'update')">
                        Approve
                        </button>

                        <button class="reject"
                        onclick="openModal(${s.id}, 'Rejected', 'Invalid Info', 'update')">
                        Reject
                        </button>

                        ${s.status !== "Pending" ? `
                        <button class="delete"
                        onclick="openModal(${s.id}, '', '', 'delete')">
                        Delete
                        </button>` : ""}

                    </div>
                </td>
            </tr>
            `;

                table.innerHTML += row;
            });

            // UPDATE COUNTERS
            document.getElementById("approvedCount").innerText = approved;
            document.getElementById("rejectedCount").innerText = rejected;
            document.getElementById("pendingCount").innerText = pending;
        }


        // ==============================
        // FILTER FUNCTION
        // ==============================
        function filterYear(year) {
            currentFilter = year;
            document.getElementById("currentView").innerText = "Viewing: " + year;
            renderTable();
        }


        // ==============================
        // OPEN MODAL
        // ==============================
        function openModal(id, status, remarks, action) {

            selectedId = id;
            selectedStatus = status;
            selectedRemarks = remarks;
            selectedAction = action;

            let text = "Are you sure?";

            if (action === "update") {
                text = "Change status to " + status + "?";
            }

            if (action === "delete") {
                text = "Delete this student permanently?";
            }

            document.getElementById("modalText").innerText = text;
            document.getElementById("confirmModal").style.display = "flex";
        }


        // ==============================
        // CLOSE MODAL
        // ==============================
        function closeModal() {
            document.getElementById("confirmModal").style.display = "none";
        }


        // ==============================
        // CONFIRM ACTION
        // ==============================
        function confirmAction() {

            // UPDATE
            if (selectedAction === "update") {

                fetch('/update-status', {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `id=${selectedId}&status=${selectedStatus}&remarks=${selectedRemarks}`
                })
                    .then(() => {
                        closeModal();
                        loadStudents();
                    });
            }

            // DELETE
            if (selectedAction === "delete") {

                fetch('/delete-student', {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `id=${selectedId}`
                })
                    .then(() => {
                        closeModal();
                        loadStudents();
                    });
            }
        }


        // ==============================
        // START
        // ==============================
        loadStudents();

    </script>

</body>
</html>
