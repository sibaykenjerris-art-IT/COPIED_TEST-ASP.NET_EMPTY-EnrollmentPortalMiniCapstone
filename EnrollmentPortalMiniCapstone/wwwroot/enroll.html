<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- FIXED (quote issue) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CEC ONLINE ENROLLMENT</title>

    <!-- FIXED PATH (if inside css folder) -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <img src="images/logo.png" class="logo">

        <div class="header-text">
            <h1>CEC ONLINE ENROLLMENT</h1>
            <p>Information Technology</p>
        </div>
    </header>

    <section class="hero">

        <h2>Start Your Future in Information Technology</h2>

        <p>Join Cebu Eastern College and become part of the next generation of IT professionals.</p>

    </section>

    <hr>

    <div class="container">

        <!-- ONLY CHANGES ARE HERE -->
        <form method="post" action="/enroll">
            <!-- NEW -->

            <h2>Student Information</h2>

            <label>Full Name</label>
            <input type="text" name="Name" placeholder="Enter full name" required> <!-- NEW name -->

            <label>Email</label>
            <input type="email" name="Email" placeholder="Enter email" required> <!-- NEW -->

            <label>Phone Number</label>
            <input type="tel" name="Contact" placeholder="Enter phone number" required> <!-- NEW -->

            <label>Address</label>
            <input type="text" name="Address" placeholder="Enter address"> <!-- NEW -->

            <label>Year Level</label>
            <select name="Year" required>
                <!-- NEW -->
                <option value="">Select Year Level</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select>

            <label>Course</label>
            <input type="text" name="Course" value="Bachelor of Science in Information Technology (BSIT)" readonly> <!-- NEW -->

            <button type="submit">Enroll Now</button>

        </form>

    </div>


    <footer>
        <p>© 2026 Cebu Eastern College | IT Enrollment System</p>
    </footer>

    <!-- ADD THIS SCRIPT BEFORE </body> -->
    <script>

        // STEP 1: Get the form
        const form = document.querySelector("form");

        // STEP 2: Listen when user submits
        form.addEventListener("submit", function (event) {

            // Get values
            let name = form["Name"].value;
            let email = form["Email"].value;
            let contact = form["Contact"].value;
            let year = form["Year"].value;

            // STEP 3: Validate
            if (name === "" || email === "" || contact === "" || year === "") {

                alert("Please fill out all required fields!");
                event.preventDefault(); // STOP form

                return;
            }

            // STEP 4: Success message
            alert("Enrollment submitted successfully!");

        });

    </script>

</body>
</html>
